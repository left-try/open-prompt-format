name: CI

on:
  workflow_call:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e packages/python
      - run: python -m unittest discover -s packages/python/tests -v
      - run: opf validate-collection examples

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
        working-directory: packages/typescript
      - run: npm test
        working-directory: packages/typescript
      - run: npm run build
        working-directory: packages/typescript
