[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-prompt-format"
version = "0.1.0"
description = "Load and render Open Prompt Format files"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]
keywords = ["prompt", "llm", "prompt-format", "prompt-management"]
urls = { Homepage = "https://left-try.github.io/open-prompt-format/", Repository = "https://github.com/left-try/open-prompt-format", Documentation = "https://left-try.github.io/open-prompt-format/" }
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.scripts]
opf = "opf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
